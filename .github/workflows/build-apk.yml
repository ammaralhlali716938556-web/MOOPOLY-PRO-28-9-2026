                  "settingsTitle": "⚙️ تنظیمات و گزینه‌ها", "themeLbl": "🌓 پوسته بازی:", "themeDark": "تاریک 🌙", "themeLight": "روشن ☀️", "langLbl": "🌐 زبان:", "propStyleLbl": "🎨 جلوه املاک:", "styleGlow": "درخشش", "styleTint": "سایه", "styleBorder": "حاشیه رنگی", "styleBadge": "نشان نماد", "diceSpeedLbl": "🎲 سرعت پرتاب تاس:", "moveSpeedLbl": "🏃 سرعت حرکت مهره:", "speedVSlow": "بسیار آرام", "speedSlow": "آرام", "speedNormal": "متعادل", "speedFast": "سریع", "speedVFast": "فوق سریع", "soundLbl": "🔊 جلوه‌های صوتی:", "soundOn": "فعال 🔊", "soundOff": "بی‌صدا 🔇", "gameDetailsLbl": "👥 جزئیات بازی فعلی:", "aboutBtn": "ℹ️ درباره بازی", "newGameBtn": "✨ بازی جدید سفارشی", "playAgain": "🔄 بازی مجدد", "closeGame": "🚪 خروج", "congrats": "🎉 تبریک! شما برنده شدید! 🎉", "jailNoRentNotice": "⚠️ در دوران حبس امکان دریافت اجاره نیست"
