          const AudioFX = {
              ctx: null,
              enabled: true,
              init() {
                  try {
                      if (!this.ctx) {
                          const AudioContext = window.AudioContext || window.webkitAudioContext;
                          if (AudioContext) this.ctx = new AudioContext();
                      }
                      if (this.ctx && this.ctx.state === 'suspended') {
                          this.ctx.resume().catch(() => {});
                      }
                  } catch(e) {}
              },
              play(type) {
                  if (!this.enabled) return;
                  try {
                      this.init();
                      if (!this.ctx) return;
                      const t = this.ctx.currentTime;

                      if (type === 'dice') {
                          const osc = this.ctx.createOscillator();
                          const g = this.ctx.createGain();
                          osc.type = 'triangle';
                          osc.frequency.setValueAtTime(140, t);
                          osc.frequency.exponentialRampToValueAtTime(40, t + 0.12);
                          g.gain.setValueAtTime(0.2, t);
                          g.gain.linearRampToValueAtTime(0.01, t + 0.12);
                          osc.connect(g);
                          g.connect(this.ctx.destination);
                          osc.start(t);
                          osc.stop(t + 0.12);
                      } else if (type === 'step') {
                          const osc = this.ctx.createOscillator();
                          const g = this.ctx.createGain();
                          osc.type = 'sine';
                          osc.frequency.setValueAtTime(440, t);
                          g.gain.setValueAtTime(0.1, t);
                          g.gain.linearRampToValueAtTime(0.01, t + 0.05);
                          osc.connect(g);
                          g.connect(this.ctx.destination);
                          osc.start(t);
                          osc.stop(t + 0.05);
                      } else if (type === 'cash') {
                          const osc = this.ctx.createOscillator();
                          const g = this.ctx.createGain();
                          osc.type = 'sine';
                          osc.frequency.setValueAtTime(587.33, t);
                          osc.frequency.setValueAtTime(880, t + 0.08);
                          g.gain.setValueAtTime(0.18, t);
                          g.gain.linearRampToValueAtTime(0.01, t + 0.22);
                          osc.connect(g);
                          g.connect(this.ctx.destination);
                          osc.start(t);
                          osc.stop(t + 0.22);
                      } else if (type === 'siren') {
                          // صوت إنذار شرطة حقيقي (سارينة طوارئ مزدوجة التردد متصاعدة ونازلة)
                          const osc1 = this.ctx.createOscillator();
                          const osc2 = this.ctx.createOscillator();
                          const g = this.ctx.createGain();
                          osc1.type = 'sawtooth';
                          osc2.type = 'triangle';
                          osc1.frequency.setValueAtTime(620, t);
                          osc1.frequency.linearRampToValueAtTime(1200, t + 0.065);
                          osc1.frequency.linearRampToValueAtTime(620, t + 0.13);

                          osc2.frequency.setValueAtTime(930, t);
                          osc2.frequency.linearRampToValueAtTime(1800, t + 0.065);
                          osc2.frequency.linearRampToValueAtTime(930, t + 0.13);

                          g.gain.setValueAtTime(0.20, t);
                          g.gain.linearRampToValueAtTime(0.01, t + 0.13);

                          osc1.connect(g);
                          osc2.connect(g);
                          g.connect(this.ctx.destination);
                          osc1.start(t);
                          osc2.start(t);
                          osc1.stop(t + 0.135);
                          osc2.stop(t + 0.135);
                      } else if (type === 'jailDoor') {
                          // صوت إغلاق زنزانة السجن وقفل القضبان الحديدية
                          // 1. ارتطام الباب الحديدي الثقيل
                          const oscThud = this.ctx.createOscillator();
                          const gThud = this.ctx.createGain();
                          oscThud.type = 'triangle';
                          oscThud.frequency.setValueAtTime(120, t);
                          oscThud.frequency.exponentialRampToValueAtTime(32, t + 0.35);
                          gThud.gain.setValueAtTime(0.45, t);
                          gThud.gain.exponentialRampToValueAtTime(0.001, t + 0.35);
                          oscThud.connect(gThud);
                          gThud.connect(this.ctx.destination);
                          oscThud.start(t);
                          oscThud.stop(t + 0.35);

                          // 2. ارتطام المعادن وصفقة المزلاج
                          const oscClang = this.ctx.createOscillator();
                          const gClang = this.ctx.createGain();
                          oscClang.type = 'sawtooth';
                          oscClang.frequency.setValueAtTime(950, t);
                          oscClang.frequency.exponentialRampToValueAtTime(220, t + 0.18);
                          gClang.gain.setValueAtTime(0.35, t);
                          gClang.gain.exponentialRampToValueAtTime(0.001, t + 0.18);
                          oscClang.connect(gClang);
                          gClang.connect(this.ctx.destination);
                          oscClang.start(t);
                          oscClang.stop(t + 0.18);

                          // 3. رنين واهتزاز قضبان الحديد في الزنزانة
                          const oscRing = this.ctx.createOscillator();
                          const gRing = this.ctx.createGain();
                          oscRing.type = 'sine';
                          oscRing.frequency.setValueAtTime(440, t + 0.02);
                          oscRing.frequency.linearRampToValueAtTime(430, t + 0.65);
                          gRing.gain.setValueAtTime(0.18, t + 0.02);
                          gRing.gain.exponentialRampToValueAtTime(0.001, t + 0.65);
                          oscRing.connect(gRing);
                          gRing.connect(this.ctx.destination);
                          oscRing.start(t + 0.02);
                          oscRing.stop(t + 0.65);
                      } else if (type === 'trainWhistle') {
                          // صوت صفارة / نفير قطار متناغم (هارموني)
                          const freqs = [370, 440, 554];
                          freqs.forEach(f => {
                              const osc = this.ctx.createOscillator();
                              const g = this.ctx.createGain();
                              osc.type = 'triangle';
                              osc.frequency.setValueAtTime(f, t);
                              g.gain.setValueAtTime(0.01, t);
                              g.gain.linearRampToValueAtTime(0.12, t + 0.08);
                              g.gain.setValueAtTime(0.12, t + 0.26);
                              g.gain.linearRampToValueAtTime(0.001, t + 0.42);
                              osc.connect(g);
                              g.connect(this.ctx.destination);
                              osc.start(t);
                              osc.stop(t + 0.42);
                          });
                      } else if (type === 'trainChug') {
                          // صوت محرك وعجلات القطار (Chug-chug)
                          const osc = this.ctx.createOscillator();
                          const g = this.ctx.createGain();
                          osc.type = 'sawtooth';
                          osc.frequency.setValueAtTime(95, t);
                          osc.frequency.exponentialRampToValueAtTime(30, t + 0.065);
                          g.gain.setValueAtTime(0.18, t);
                          g.gain.linearRampToValueAtTime(0.001, t + 0.065);
                          osc.connect(g);
                          g.connect(this.ctx.destination);
                          osc.start(t);
                          osc.stop(t + 0.065);
                      } else if (type === 'firework') {
                          // ألعاب نارية احتفالية (صفير إطلاق + انفجار عميق + مفرقعات نارية)
                          const oscW = this.ctx.createOscillator();
                          const gW = this.ctx.createGain();
                          oscW.type = 'sine';
                          oscW.frequency.setValueAtTime(320, t);
                          oscW.frequency.exponentialRampToValueAtTime(1450, t + 0.18);
                          gW.gain.setValueAtTime(0.08, t);
                          gW.gain.linearRampToValueAtTime(0.001, t + 0.18);
                          oscW.connect(gW);
                          gW.connect(this.ctx.destination);
                          oscW.start(t);
                          oscW.stop(t + 0.18);

                          const oscB = this.ctx.createOscillator();
                          const gB = this.ctx.createGain();
                          oscB.type = 'triangle';
                          oscB.frequency.setValueAtTime(115, t + 0.18);
                          oscB.frequency.exponentialRampToValueAtTime(25, t + 0.55);
                          gB.gain.setValueAtTime(0.35, t + 0.18);
                          gB.gain.exponentialRampToValueAtTime(0.001, t + 0.55);
                          oscB.connect(gB);
                          gB.connect(this.ctx.destination);
                          oscB.start(t + 0.18);
                          oscB.stop(t + 0.55);

                          for (let i = 0; i < 4; i++) {
                              const delay = 0.24 + i * 0.055 + Math.random() * 0.03;
                              const oscP = this.ctx.createOscillator();
                              const gP = this.ctx.createGain();
                              oscP.type = 'square';
                              oscP.frequency.setValueAtTime(650 + Math.random() * 600, t + delay);
                              gP.gain.setValueAtTime(0.05, t + delay);
                              gP.gain.linearRampToValueAtTime(0.001, t + delay + 0.035);
                              oscP.connect(gP);
                              gP.connect(this.ctx.destination);
                              oscP.start(t + delay);
                              oscP.stop(t + delay + 0.035);
                          }
                      }
                  } catch(e) {}
              }
          };

          const SAVE_KEY = "monopoly_pro_save_v1";

          const Game = {
              lang: 'ar',
              theme: 'dark',
              propStyle: 'glow',
              diceSpeed: 'normal',
              moveSpeed: 'normal',
              mode: 'ai',
              aiDifficulty: 'medium',
              startingCash: 3000,
              turn: 0,
              doublesInRow: 0,
              isRolling: false,
              pendingTile: null,
              auction: null,
              tradeData: null,
              fastTravelData: null,
              isGameOver: false,
              players: [
                  { id:0, nameAr:"الملك", nameEn:"King", avatar:"👑", color:"#EF4444", money:3000, pos:0, inJail:false, jailTurns:0, props:[] },
                  { id:1, nameAr:"روبوت", nameEn:"Robot", avatar:"🤖", color:"#38BDF8", money:3000, pos:0, inJail:false, jailTurns:0, props:[] }
              ]
          };

          let newGameConfig = {
              mode: 'ai',
              difficulty: 'medium',
              cash: 3000
          };

          let fireworkSoundInterval = null;

          function hasSavedGame() {
              try {
                  const raw = localStorage.getItem(SAVE_KEY);
                  if (!raw) return false;
                  const data = JSON.parse(raw);
                  return !!(data && data.players && data.players.length > 0 && !data.isGameOver);
              } catch(e) {
                  return false;
              }
          }

          function saveCurrentGame() {
              try {
                  const saveData = {
                      savedAt: Date.now(),
                      isGameOver: Game.isGameOver,
                      turn: Game.turn,
                      doublesInRow: Game.doublesInRow,
                      mode: Game.mode,
                      aiDifficulty: Game.aiDifficulty,
                      startingCash: Game.startingCash,
                      theme: Game.theme,
                      diceSpeed: Game.diceSpeed,
                      moveSpeed: Game.moveSpeed,
                      propStyle: Game.propStyle,
                      lang: Game.lang,
                      players: JSON.parse(JSON.stringify(Game.players)),
                      tiles: BOARD_TILES.map(t => ({ id: t.id, owner: t.owner, mortgaged: t.mortgaged, floors: t.floors || 0 }))
                  };
                  localStorage.setItem(SAVE_KEY, JSON.stringify(saveData));
                  return true;
              } catch(e) {
                  return false;
              }
          }

          function loadSavedGame() {
              try {
                  const raw = localStorage.getItem(SAVE_KEY);
                  if (!raw) return false;
                  const data = JSON.parse(raw);
                  if (!data || !data.players) return false;

                  Game.turn = data.turn ?? 0;
                  Game.doublesInRow = data.doublesInRow ?? 0;
                  if (data.mode) Game.mode = data.mode;
                  if (data.aiDifficulty) Game.aiDifficulty = data.aiDifficulty;
                  if (data.startingCash) Game.startingCash = data.startingCash;
                  if (data.theme) setTheme(data.theme);
                  if (data.diceSpeed) Game.diceSpeed = data.diceSpeed;
                  if (data.moveSpeed) Game.moveSpeed = data.moveSpeed;
                  if (data.propStyle) Game.propStyle = data.propStyle;
                  if (data.lang) Game.lang = data.lang;

                  Game.players = data.players;
                  if (data.tiles) {
                      data.tiles.forEach(st => {
                          const t = BOARD_TILES.find(x => x.id === st.id);
                          if (t) {
                              t.owner = st.owner;
                              t.mortgaged = st.mortgaged;
                              t.floors = st.floors || 0;
                          }
                      });
                  }

                  setLanguage(Game.lang);
                  setPropStyle(Game.propStyle);
                  setDiceSpeed(Game.diceSpeed);
                  setMoveSpeed(Game.moveSpeed);
                  updateBoardVisual();
                  updatePawns();
                  updateUI();
                  return true;
              } catch(e) {
                  return false;
              }
          }

          // خيار إكمال اللعبة السابقة لا يعمل إلا إذا كان اللاعب قد بدأ وحفظ لعبة مسبقاً
          function showStartModal() {
              const btnCont = document.getElementById("btnContinueGame");
              const statusTxt = document.getElementById("savedGameStatus");
              const canContinue = hasSavedGame();

              if (canContinue) {
                  btnCont.disabled = false;
                  btnCont.style.opacity = "1";
                  btnCont.style.cursor = "pointer";
                  btnCont.classList.remove("btn-gray");
                  btnCont.classList.add("btn-blue");
                  try {
                      const d = JSON.parse(localStorage.getItem(SAVE_KEY));
                      const dt = d.savedAt ? new Date(d.savedAt).toLocaleDateString('ar-EG', { hour: '2-digit', minute: '2-digit' }) : "";
                      statusTxt.innerText = dt ? `يوجد لعبة محفوظة بتاريخ: ${dt}` : (I18N[Game.lang].continueGame);
                  } catch(e) {
                      statusTxt.innerText = I18N[Game.lang].continueGame;
                  }
              } else {
                  btnCont.disabled = true;
                  btnCont.style.opacity = "0.45";
                  btnCont.style.cursor = "not-allowed";
                  btnCont.classList.remove("btn-blue");
                  btnCont.classList.add("btn-gray");
                  statusTxt.innerText = Game.lang === 'ar' ?
                      "لا توجد لعبة محفوظة حالياً (احفظ لعبتك عند الخروج للمتابعة لاحقاً)." :
                      "No saved game found (save your game when exiting to resume later).";
              }
              document.getElementById("startModal").classList.add("show");
          }

          function continueSavedGameFromModal() {
              if (!hasSavedGame()) return;
              const ok = loadSavedGame();
              if (ok) {
                  document.getElementById("startModal").classList.remove("show");
                  logEvent("📂 " + (I18N[Game.lang].continueGame) + " ✓");
                  startPlayerTurn();
              }
          }

          function openNewGameSetupModal(canCancel = false) {
              document.getElementById("startModal").classList.remove("show");
              document.getElementById("settingsModal").classList.remove("show");
              document.getElementById("gameOverModal").classList.remove("show");
              stopMoneyRain();

              const btnClose = document.getElementById("btnCloseSetupModal");
              if (btnClose) {
                  btnClose.style.display = canCancel ? "block" : "none";
              }

              newGameConfig.mode = Game.mode || 'ai';
              newGameConfig.difficulty = Game.aiDifficulty || 'medium';
              newGameConfig.cash = Game.startingCash || 3000;

              selectGameMode(newGameConfig.mode);
              selectAIDifficulty(newGameConfig.difficulty);
              selectStartingCash(newGameConfig.cash);

              document.getElementById("inputPlayer1Name").value = Game.players[0].nameAr || (Game.lang==='ar' ? "الملك" : "Player 1");
              if (newGameConfig.mode === 'pvp') {
                  document.getElementById("inputPlayer2Name").value = (Game.players[1].nameAr !== "روبوت") ? Game.players[1].nameAr : (Game.lang==='ar' ? "اللاعب 2" : "Player 2");
              } else {
                  document.getElementById("inputPlayer2Name").value = (Game.lang==='ar' ? "روبوت" : "Robot");
              }

              document.getElementById("newGameSetupModal").classList.add("show");
          }

          function closeNewGameSetupModal() {
              document.getElementById("newGameSetupModal").classList.remove("show");
              showStartModal();
          }

          function selectGameMode(mode) {
              newGameConfig.mode = mode;
              const btnAI = document.getElementById("btnModeAI");
              const btnPvP = document.getElementById("btnModePvP");
              const aiDiffSec = document.getElementById("aiDifficultySection");
              const lblP1 = document.getElementById("lblPlayer1Name");
              const lblP2 = document.getElementById("lblPlayer2Name");
              const inputP2 = document.getElementById("inputPlayer2Name");

              if (mode === 'ai') {
                  btnAI.classList.add("active");
                  btnPvP.classList.remove("active");
                  aiDiffSec.style.display = "block";
                  lblP1.innerText = Game.lang === 'ar' ? "اسم اللاعب 1 (أنت 👑):" : "Your Name (Player 1):";
                  lblP2.innerText = Game.lang === 'ar' ? "الخصم (الكمبيوتر):" : "Computer (Robot):";
                  inputP2.value = Game.lang === 'ar' ? "روبوت" : "Robot";
                  inputP2.readOnly = true;
                  inputP2.style.background = "rgba(128,128,128,0.15)";
              } else {
                  btnPvP.classList.add("active");
                  btnAI.classList.remove("active");
                  aiDiffSec.style.display = "none";
                  lblP1.innerText = Game.lang === 'ar' ? "اسم اللاعب الأول 👑:" : "Player 1 Name:";
                  lblP2.innerText = Game.lang === 'ar' ? "اسم اللاعب الثاني 🦅:" : "Player 2 Name:";
                  if (inputP2.value === "روبوت" || inputP2.value === "Robot") {
                      inputP2.value = Game.lang === 'ar' ? "اللاعب 2" : "Player 2";
                  }
                  inputP2.readOnly = false;
                  inputP2.style.background = "var(--input-bg)";
              }
          }

          // 4 مستويات صعوبة تتضمن مستوى "صعب جداً"
          function selectAIDifficulty(diff) {
              newGameConfig.difficulty = diff;
              ['easy', 'medium', 'hard', 'very_hard'].forEach(d => {
                  const idSuffix = d === 'very_hard' ? 'VeryHard' : (d.charAt(0).toUpperCase() + d.slice(1));
                  const btn = document.getElementById("btnDiff" + idSuffix);
                  if (btn) {
                      if (d === diff) btn.classList.add("active");
                      else btn.classList.remove("active");
                  }
              });

              const descEl = document.getElementById("diffDescription");
              if (descEl) {
                  if (diff === 'easy') {
                      descEl.innerText = Game.lang === 'ar' ? "🟢 سهل: قرارات شراء بسيطة، وتفاوض متساهل في المقايضة والمزادات." : "🟢 Easy: Simple AI decisions and generous trades.";
                  } else if (diff === 'medium') {
                      descEl.innerText = Game.lang === 'ar' ? "🟡 متوسط: توازن معتدل بين الشراء والمزايدة وإدارة الأموال." : "🟡 Medium: Balanced buying, bidding, and money management.";
                  } else if (diff === 'hard') {
                      descEl.innerText = Game.lang === 'ar' ? "🔴 صعب: ذكاء شرس! يستحوذ على العقارات باحترافية وينافس بشدة في المزادات." : "🔴 Hard: Aggressive AI! Fights for monopolies and drives hard bargains.";
                  } else {
                      descEl.innerText = Game.lang === 'ar' ? "🔥 صعب جداً: ذكاء فائق وشديد الشراسة! يدير الرهونات والصفقات والمزادات بعبقرية واحترافية، شبه مستحيل هزيمته." : "🔥 Very Hard: Ruthless genius AI! Masters mortgages, trades, and bidding. Near impossible to beat!";
                  }
              }
          }

          function selectStartingCash(cash) {
              newGameConfig.cash = parseInt(cash);
              [3000, 6000, 9000].forEach(c => {
                  const btn = document.getElementById("btnCash" + c);
                  if (btn) {
                      if (c === cash) btn.classList.add("active");
                      else btn.classList.remove("active");
                  }
              });
          }

          function confirmStartNewGame() {
              const p1Input = document.getElementById("inputPlayer1Name").value.trim();
              const p1Name = p1Input || (Game.lang === 'ar' ? "الملك" : "King");

              let p2Name;
              if (newGameConfig.mode === 'ai') {
                  p2Name = Game.lang === 'ar' ? "روبوت" : "Robot";
              } else {
                  const p2Input = document.getElementById("inputPlayer2Name").value.trim();
                  p2Name = p2Input || (Game.lang === 'ar' ? "اللاعب 2" : "Player 2");
              }

              Game.mode = newGameConfig.mode;
              Game.aiDifficulty = newGameConfig.difficulty;
              Game.startingCash = newGameConfig.cash;

              Game.players[0].nameAr = p1Name;
              Game.players[0].nameEn = p1Name;
              Game.players[0].avatar = "👑";
              Game.players[0].money = Game.startingCash;
              Game.players[0].pos = 0;
              Game.players[0].inJail = false;
              Game.players[0].jailTurns = 0;
              Game.players[0].props = [];

              Game.players[1].nameAr = p2Name;
              Game.players[1].nameEn = p2Name;
              Game.players[1].avatar = (Game.mode === 'ai') ? "🤖" : "🦅";
              Game.players[1].money = Game.startingCash;
              Game.players[1].pos = 0;
              Game.players[1].inJail = false;
              Game.players[1].jailTurns = 0;
              Game.players[1].props = [];

              BOARD_TILES.forEach(t => {
                  t.owner = undefined;
                  t.mortgaged = false;
                  t.floors = 0;
              });

              Game.turn = 0;
              Game.doublesInRow = 0;
              Game.isRolling = false;
              Game.pendingTile = null;
              Game.auction = null;
              Game.tradeData = null;
              Game.fastTravelData = null;
              Game.isGameOver = false;

              // مسح الحفظ السابق حتى يتم حفظ لعبة جديدة صراحة عند الخروج
              localStorage.removeItem(SAVE_KEY);

              document.getElementById("newGameSetupModal").classList.remove("show");
              document.getElementById("startModal").classList.remove("show");
              document.getElementById("gameOverModal").classList.remove("show");
              document.getElementById("settingsModal").classList.remove("show");
              stopMoneyRain();

              updatePawns();
              updateUI();
              const diffMap = { 'easy': ' (سهل)', 'medium': ' (متوسط)', 'hard': ' (صعب)', 'very_hard': ' (صعب جداً 🔥)' };
              const diffText = Game.mode === 'ai' ? (diffMap[Game.aiDifficulty] || "") : "";
              logEvent(`🎮 بدأت لعبة جديدة برصيد ${Game.startingCash}$! دور ${Game.players[0].avatar} ${Game.players[0].nameAr}${diffText}.`);
              startPlayerTurn();
          }

          function getGridCoords(i) {
              if (i === 0) return { r: 11, c: 11 };
              if (i >= 1 && i <= 9) return { r: 11, c: 11 - i };
              if (i === 10) return { r: 11, c: 1 };
              if (i >= 11 && i <= 19) return { r: 11 - (i - 10), c: 1 };
              if (i === 20) return { r: 1, c: 1 };
              if (i >= 21 && i <= 29) return { r: 1, c: 1 + (i - 20) };
              if (i === 30) return { r: 1, c: 11 };
              if (i >= 31 && i <= 39) return { r: 1 + (i - 30), c: 11 };
              return { r: 11, c: 11 };
          }

          function renderBoard() {
              const boardEl = document.getElementById("board");
              BOARD_TILES.forEach((tile, index) => {
                  const coords = getGridCoords(index);
                  const tileDiv = document.createElement("div");
                  tileDiv.id = "tile-" + index;

                  let side = "side-bottom";
                  if (index >= 11 && index <= 19) side = "side-left";
                  else if (index >= 20 && index <= 30) side = "side-top";
                  else if (index >= 31 && index <= 39) side = "side-right";
                  tileDiv.className = "tile " + side + ([0, 10, 20, 30].includes(index) ? " corner-tile corner-" + index : "");

                  tileDiv.style.gridRow = coords.r;
                  tileDiv.style.gridColumn = coords.c;
                  tileDiv.onclick = () => openTileInfoModal(index);

                  let h = "";
                  const displayName = getTileName(index, Game.lang);
                  if (tile.type === "property") {
                      h += `<div class="tile-bar" style="background:${tile.color}"></div><div class="tile-cnt"><div class="tile-name" id="tName-${index}">${displayName}</div><div class="tile-price">${tile.price}$</div></div>`;
                  } else if (tile.type === "railroad" || tile.type === "utility") {
                      h += `<div class="tile-cnt"><div class="tile-icon">${tile.icon}</div><div class="tile-name" id="tName-${index}">${displayName}</div><div class="tile-price">${tile.price}$</div></div>`;
                  } else {
                      h += `<div class="tile-cnt"><div class="tile-icon">${tile.icon||"🏛️"}</div><div class="tile-name" id="tName-${index}">${displayName}</div></div>`;
                  }
                  h += `<div class="tile-pawns" id="pawns-${index}"></div>`;
                  tileDiv.innerHTML = h;
                  boardEl.appendChild(tileDiv);
              });
              updatePawns();
          }

          let pawnEl0 = null, pawnEl1 = null;
          function getPawnEl(id) {
              if (id === 0) {
                  if (!pawnEl0) { pawnEl0 = document.createElement("div"); pawnEl0.id = "pawn-p0"; pawnEl0.className = "pawn pawn-p0"; }
                  pawnEl0.innerText = Game.players[0].avatar;
                  return pawnEl0;
              } else {
                  if (!pawnEl1) { pawnEl1 = document.createElement("div"); pawnEl1.id = "pawn-p1"; pawnEl1.className = "pawn pawn-p1"; }
                  pawnEl1.innerText = Game.players[1].avatar;
                  return pawnEl1;
              }
          }

          function updatePawns(movingId = null) {
              if (movingId !== null) {
                  const p = Game.players[movingId];
                  const el = getPawnEl(movingId);
                  const target = document.getElementById("pawns-" + p.pos);
                  if (target && el.parentElement !== target) {
                      target.appendChild(el);
                      el.classList.add("moving-step");
                      setTimeout(() => el.classList.remove("moving-step"), 110);
                  }
                  return;
              }
              Game.players.forEach(p => {
                  const el = getPawnEl(p.id);
                  const target = document.getElementById("pawns-" + p.pos);
                  if (target && el.parentElement !== target) {
                      target.appendChild(el);
                  }
              });
          }

          function updateUI() {
              const p0 = Game.players[0], p1 = Game.players[1];
              document.getElementById("cashP0").innerText = p0.money + "$";
              document.getElementById("cashP1").innerText = p1.money + "$";
              const m0 = p0.props.filter(id => BOARD_TILES[id].mortgaged).length;
              const m1 = p1.props.filter(id => BOARD_TILES[id].mortgaged).length;
              document.getElementById("propsP0").innerText = `${I18N[Game.lang].p} ${p0.props.length}`;
              document.getElementById("propsP1").innerText = `${I18N[Game.lang].p} ${p1.props.length}`;
              document.getElementById("mortP0").innerText = m0 > 0 ? `(${I18N[Game.lang].m} ${m0})` : "";
              document.getElementById("mortP1").innerText = m1 > 0 ? `(${I18N[Game.lang].m} ${m1})` : "";

              document.getElementById("pCard0").className = "p-card" + (Game.turn === 0 ? " active" : "");
              document.getElementById("pCard1").className = "p-card" + (Game.turn === 1 ? " active" : "");
              document.getElementById("turnBadge0").style.display = Game.turn === 0 ? "block" : "none";
              document.getElementById("turnBadge1").style.display = Game.turn === 1 ? "block" : "none";

              if (Game.mode === 'pvp') {
                  document.getElementById("turnBadge0").innerText = I18N[Game.lang].turn;
                  document.getElementById("turnBadge1").innerText = I18N[Game.lang].turn;
              } else {
                  document.getElementById("turnBadge0").innerText = I18N[Game.lang].turn;
                  document.getElementById("turnBadge1").innerText = I18N[Game.lang].opp;
              }

              const cur = Game.players[Game.turn];
              document.getElementById("turnAnnouncer").innerText = `${I18N[Game.lang].turn}: ${cur.avatar} ${cur.nameAr}`;
              document.getElementById("avP0").innerText = p0.avatar;
              document.getElementById("avP1").innerText = p1.avatar;
              document.getElementById("nameP0").innerText = p0.nameAr;
              document.getElementById("nameP1").innerText = p1.nameAr;

              const summaryEl = document.getElementById("txtCurrentGameSummary");
              if (summaryEl) {
                  const modeTxt = Game.mode === 'ai' ? (Game.lang==='ar'?"ضد روبوت 🤖":"vs Robot 🤖") : (Game.lang==='ar'?"لاعبين اثنين 👥":"2 Players 👥");
                  const diffMap = { 'easy': ' (سهل)', 'medium': ' (متوسط)', 'hard': ' (صعب)', 'very_hard': ' (صعب جداً 🔥)' };
                  const diffTxt = Game.mode === 'ai' ? (diffMap[Game.aiDifficulty] || "") : "";
                  summaryEl.innerText = `${modeTxt}${diffTxt} | ${Game.lang==='ar'?"البداية":"Cash"}: ${Game.startingCash}$`;
              }

              updateBoardVisual();
          }

          function updateBoardVisual() {
              const jailTile = document.getElementById("tile-10");
              if (jailTile) {
                  const existingBars = jailTile.querySelector(".jail-bars-overlay");
                  const someoneJailed = Game.players.some(p => p.inJail);
                  if (someoneJailed) {
                      if (!existingBars) {
                          const bars = document.createElement("div");
                          bars.className = "jail-bars-overlay";
                          jailTile.appendChild(bars);
                      }
                  } else {
                      if (existingBars) existingBars.remove();
                  }
              }

              BOARD_TILES.forEach(t => {
                  const el = document.getElementById("tile-" + t.id);
                  if (!el) return;
                  el.classList.remove("owned-glow","owned-tint","owned-border");
                  const b = el.querySelector(".tile-owner-badge"); if (b) b.remove();
                  const mb = el.querySelector(".tile-mortgaged-badge"); if (mb) mb.remove();
                  const bl = el.querySelector(".tile-building"); if (bl) bl.remove();

                  if (t.owner !== undefined) {
                      const owner = Game.players[t.owner];
                      el.style.color = t.owner === 0 ? "var(--p0)" : "var(--p1)";
                      if (Game.propStyle === 'glow') el.classList.add("owned-glow");
                      else if (Game.propStyle === 'tint') el.classList.add("owned-tint");
                      else if (Game.propStyle === 'border') el.classList.add("owned-border");
                      else if (Game.propStyle === 'badge') {
                          const bg = document.createElement("div"); bg.className = "tile-owner-badge"; bg.innerText = owner.avatar; el.appendChild(bg);
                      }
                      if (t.mortgaged) {
                          const mg = document.createElement("div"); mg.className = "tile-mortgaged-badge"; mg.innerText = Game.lang==='ar'?"مَرْهُون":"MORTGAGED"; el.appendChild(mg);
                      }
                      if (t.floors && t.floors > 0) {
                          const bDiv = document.createElement("div");
                          if (t.floors === 5) {
                              bDiv.className = "tile-building gold";
                              bDiv.innerHTML = `<span style="font-size:0.75rem;">🗼</span>`;
                              bDiv.title = I18N[Game.lang].eiffelTower;
                          } else {
                              bDiv.className = "tile-building lime";
                              bDiv.innerHTML = `<span>🏢</span><span>${t.floors}</span>`;
                              bDiv.title = `${t.floors} ${I18N[Game.lang].floors}`;
                          }
                          el.appendChild(bDiv);
                      }
                  } else { el.style.color = ""; }
              });
          }

          function logEvent(msg) {
              const el = document.getElementById("gameLog");
              el.innerText = msg;
          }

          function calculateRent(tile) {
              if (tile.type === "railroad") {
                  const cnt = BOARD_TILES.filter(t => t.type === "railroad" && t.owner === tile.owner).length;
                  return 25 * Math.pow(2, cnt - 1);
              }
              if (tile.type === "utility") {
                  const cnt = BOARD_TILES.filter(t => t.type === "utility" && t.owner === tile.owner).length;
                  return cnt === 2 ? 50 : 20;
              }
              const groupTiles = BOARD_TILES.filter(t => t.group === tile.group);
              const hasMonopoly = groupTiles.every(t => t.owner === tile.owner);

              const baseRent = Math.round(tile.price * 0.20);
              const floorCost = Math.round(tile.price * 0.33);
              const floorRentBonus = Math.round(floorCost * 0.50);

              if (hasMonopoly) {
                  if (tile.floors && tile.floors > 0) {
                      return Math.round(tile.price * 0.40) + (tile.floors * floorRentBonus);
                  }
                  return Math.round(tile.price * 0.40);
              }
              return baseRent;
          }

          function canBuildFloor(tileId, playerId) {
              const t = BOARD_TILES[tileId];
              if (!t || t.type !== "property") return { ok: false, reason: "not_property" };
              if (t.owner !== playerId) return { ok: false, reason: "not_owner" };
              const groupTiles = BOARD_TILES.filter(x => x.group === t.group);
              if (!groupTiles.every(x => x.owner === playerId)) return { ok: false, reason: "monopolyRequired" };
              if (groupTiles.some(x => x.mortgaged)) return { ok: false, reason: "groupMortgaged" };
              const curFloors = t.floors || 0;
              if (curFloors >= 5) return { ok: false, reason: "maxFloors" };
              const minFloors = Math.min(...groupTiles.map(x => x.floors || 0));
              if (curFloors > minFloors) return { ok: false, reason: "evenBuildNotice", minFloors };
              const cost = Math.round(t.price * 0.33);
              const player = Game.players[playerId];
              if (player.money < cost) return { ok: false, reason: "notEnoughCash", cost };
              return { ok: true, cost };
          }

          function canDemolishFloor(tileId, playerId) {
              const t = BOARD_TILES[tileId];
              if (!t || t.type !== "property") return { ok: false, reason: "not_property" };
              if (t.owner !== playerId) return { ok: false, reason: "not_owner" };
              const groupTiles = BOARD_TILES.filter(x => x.group === t.group);
              const curFloors = t.floors || 0;
              if (curFloors <= 0) return { ok: false, reason: "noFloors" };
              const maxFloors = Math.max(...groupTiles.map(x => x.floors || 0));
              if (curFloors < maxFloors) return { ok: false, reason: "evenDemoNotice", maxFloors };
              const cost = Math.round(t.price * 0.33);
              const refund = Math.round(cost * 0.50);
              return { ok: true, refund };
          }

          function buildFloor(tileId, playerId) {
              const pId = (playerId !== undefined) ? playerId : Game.turn;
              const chk = canBuildFloor(tileId, pId);
              if (!chk.ok) {
                  logEvent("⚠️ " + (I18N[Game.lang][chk.reason] || I18N[Game.lang].evenBuildNotice));
                  return;
              }
              const t = BOARD_TILES[tileId];
              const p = Game.players[pId];
              p.money -= chk.cost;
              t.floors = (t.floors || 0) + 1;
              AudioFX.play('cash');
              updateBoardVisual();
              updateUI();
              if (t.floors === 5) {
                  logEvent(`🗼 ${p.avatar} ${p.nameAr} ${Game.lang==='ar'?'أكمل بناء برج إيفل الذهبي في':'completed Golden Eiffel Tower in'} (${getTileName(t.id, Game.lang)})!`);
              } else {
                  logEvent(`🏗️ ${p.avatar} ${p.nameAr} ${Game.lang==='ar'?'بنى الطابق':'built floor'} ${t.floors} (ليموني) ${Game.lang==='ar'?'في':'in'} (${getTileName(t.id, Game.lang)}) مقابل ${chk.cost}$.`);
              }
              const tm = document.getElementById("tileInfoModal");
              if (tm && tm.classList.contains("show")) openTileInfoModal(tileId);
          }

          function demolishFloor(tileId, playerId) {
              const pId = (playerId !== undefined) ? playerId : Game.turn;
              const chk = canDemolishFloor(tileId, pId);
              if (!chk.ok) {
                  logEvent("⚠️ " + (I18N[Game.lang][chk.reason] || I18N[Game.lang].evenDemoNotice));
                  return;
              }
              const t = BOARD_TILES[tileId];
              const p = Game.players[pId];
              p.money += chk.refund;
              t.floors--;
              AudioFX.play('cash');
              updateBoardVisual();
              updateUI();
              logEvent(`🔨 ${p.avatar} ${p.nameAr} ${Game.lang==='ar'?'هدم طابقاً من':'demolished floor from'} (${getTileName(t.id, Game.lang)}) واسترد ${chk.refund}$.`);
              const tm = document.getElementById("tileInfoModal");
              if (tm && tm.classList.contains("show")) openTileInfoModal(tileId);
          }

          // ذكاء اصطناعي لبناء الطوابق وإدارة الممتلكات
          function checkAIBuilding() {
              if (Game.mode !== 'ai' || Game.turn !== 1) return;
              const ai = Game.players[1];
              const diff = Game.aiDifficulty || 'medium';
              const minBuffer = diff === 'very_hard' ? 40 : (diff === 'hard' ? 120 : (diff === 'medium' ? 250 : 500));

              const monoGroups = [];
              const groups = ['brown', 'lightblue', 'pink', 'orange', 'red', 'yellow', 'green', 'darkblue'];
              groups.forEach(g => {
                  const gTiles = BOARD_TILES.filter(t => t.group === g);
                  if (gTiles.length > 0 && gTiles.every(t => t.owner === 1)) {
                      monoGroups.push(g);
                  }
              });

              for (const group of monoGroups) {
                  const groupTiles = BOARD_TILES.filter(t => t.group === group);
                  if (groupTiles.some(t => t.mortgaged)) continue;
                  const minFloors = Math.min(...groupTiles.map(t => t.floors || 0));
                  if (minFloors >= 5) continue;

                  for (const t of groupTiles) {
                      const cost = Math.round(t.price * 0.33);
                      if ((t.floors || 0) === minFloors && ai.money >= cost + minBuffer) {
                          buildFloor(t.id, 1);
                          return;
                      }
                  }
              }
          }

          // قرارات الرهن وفك الرهن الاستراتيجية للكمبيوتر في المستوى الصعب جداً
          function checkAIStrategicFinance() {
              if (Game.mode !== 'ai' || Game.turn !== 1) return;
              const ai = Game.players[1];
              const diff = Game.aiDifficulty || 'medium';

              if (diff === 'very_hard') {
                  // فك رهن العقارات الهامة فور توفر فائض سيولة نقدي
                  if (ai.money >= 350) {
                      const mortgagedProps = ai.props.map(id => BOARD_TILES[id]).filter(t => t && t.mortgaged);
                      for (const t of mortgagedProps) {
                          const unmortCost = Math.floor(Math.floor(t.price * 0.5) * 1.1);
                          if (ai.money >= unmortCost + 120) {
                              ai.money -= unmortCost;
                              t.mortgaged = false;
                              AudioFX.play('cash');
                              logEvent(`🏦 فك ${ai.avatar} ${ai.nameAr} رهن عقار (${getTileName(t.id, Game.lang)}) لاستئناف تحصيل الإيجارات.`);
                              updateUI();
                              break;
                          }
                      }
                  }

                  // رهن وقائي لعقارات غير مؤثرة إذا كان الرصيد ضعيفاً جداً قبل تحركات الخصم
                  if (ai.money < 70) {
                      const singleProps = ai.props.map(id => BOARD_TILES[id]).filter(t => !t.mortgaged && (!t.floors || t.floors === 0));
                      for (const t of singleProps) {
                          const groupTiles = BOARD_TILES.filter(x => x.group === t.group);
                          const hasMono = groupTiles.every(x => x.owner === 1);
                          if (!hasMono) {
                              t.mortgaged = true;
                              const val = Math.floor(t.price * 0.5);
                              ai.money += val;
                              logEvent(`🏦 رهن ${ai.avatar} ${ai.nameAr} (${getTileName(t.id, Game.lang)}) لتأمين سيولة دفاعية.`);
                              updateUI();
                              break;
                          }
                      }
                  }
              }
          }

          function rollDice() {
              if (Game.isRolling || Game.isGameOver) return;
              const cur = Game.players[Game.turn];
              if (cur.inJail) {
                  if (Game.turn === 0 || Game.mode === 'pvp') {
                      openJailModal();
                  } else {
                      handleAIJailDecision(cur);
                  }
                  return;
              }

              Game.isRolling = true;
              document.getElementById("btnRoll").disabled = true;

              const d0 = document.getElementById("die0");
              const d1 = document.getElementById("die1");
              d0.classList.add("rolling");
              d1.classList.add("rolling");
              AudioFX.play('dice');

              const dur = Game.diceSpeed === "v_slow" ? 1400 : (Game.diceSpeed === "slow" ? 900 : (Game.diceSpeed === "fast" ? 250 : (Game.diceSpeed === "v_fast" ? 100 : 500)));
              setTimeout(() => {
                  d0.classList.remove("rolling");
                  d1.classList.remove("rolling");

                  const val0 = Math.floor(Math.random() * 6) + 1;
                  const val1 = Math.floor(Math.random() * 6) + 1;
                  setDieFace(d0, val0);
                  setDieFace(d1, val1);

                  const sum = val0 + val1;
                  const isDbl = (val0 === val1);
                  logEvent(`${cur.avatar} ${cur.nameAr} ${I18N[Game.lang].rolled} ${sum} (${val0}+${val1})${isDbl ? " 🔥 متطابق!" : ""}`);

                  if (isDbl) {
                      Game.doublesInRow++;
                      if (Game.doublesInRow >= 3) {
                          Game.doublesInRow = 0;
                          logEvent(`🚔 3 رميات متطابقة! أُرسل ${cur.nameAr} إلى السجن.`);
                          sendToJail(cur, () => finishTurn(false));
                          return;
                      }
                  } else { Game.doublesInRow = 0; }

                  moveSteps(cur, sum, isDbl);
              }, dur);
          }

          // اتخاذ قرار السجن للكمبيوتر: في المستوى الصعب جداً يفضل البقاء في السجن استراتيجياً إذا كانت شوارع الخصم خطيرة ومبنية
          function handleAIJailDecision(cur) {
              const diff = Game.aiDifficulty || 'medium';
              if (diff === 'very_hard') {
                  const humanPlayer = Game.players[0];
                  const humanDanger = humanPlayer.props.some(id => {
                      const t = BOARD_TILES[id];
                      return t && ((t.floors || 0) > 0 || (t.type === 'railroad' && humanPlayer.props.filter(x => BOARD_TILES[x].type === 'railroad').length >= 3));
                  });

                  // إذا كان هناك عقارات خطيرة لدى الخصم، يفضل الكمبيوتر البقاء في السجن لتفادي الإفلاس
                  if (humanDanger) {
                      rollForJail();
                      return;
                  }
                  if (cur.money >= 100) {
                      payJailFine();
                  } else {
                      rollForJail();
                  }
              } else if (diff === 'hard') {
                  if (cur.money >= 150) payJailFine();
                  else rollForJail();
              } else if (diff === 'easy') {
                  if (cur.money >= 600) payJailFine();
                  else rollForJail();
              } else {
                  if (cur.money >= 300) payJailFine();
                  else rollForJail();
              }
          }

          function setDieFace(dieEl, val) {
              const rot = {
                  1: "rotateX(0deg) rotateY(0deg)",
                  6: "rotateY(180deg)",
                  2: "rotateY(90deg)",
                  5: "rotateY(-90deg)",
                  3: "rotateX(-90deg)",
                  4: "rotateX(90deg)"
              };
              dieEl.style.transform = rot[val];
          }

          function moveSteps(player, steps, isDbl) {
              let rem = steps;
              const iv = Game.moveSpeed === "v_slow" ? 350 : (Game.moveSpeed === "slow" ? 200 : (Game.moveSpeed === "fast" ? 60 : (Game.moveSpeed === "v_fast" ? 20 : 120)));
              const t = setInterval(() => {
                  player.pos = (player.pos + 1) % 40;
                  AudioFX.play('step');
                  updatePawns(player.id);
                  if (player.pos === 0) {
                      player.money += 200;
                      AudioFX.play('cash');
                      logEvent(`🏁 ${player.avatar} ${player.nameAr}: ${I18N[Game.lang].passGo}`);
                      updateUI();
                  }
                  rem--;
                  if (rem <= 0) {
                      clearInterval(t);
                      setTimeout(() => handleLanding(player, isDbl), 160);
                  }
              }, iv);
          }

          function handleLanding(player, isDbl) {
              const tile = BOARD_TILES[player.pos];
              updateUI();

              if (tile.type === "gotojail") {
                  logEvent(`🚨 خانة السجن! يُنقل ${player.avatar} ${player.nameAr} إلى السجن.`);
                  sendToJail(player, () => finishTurn(false));
                  return;
              }

              if (tile.type === "tax") {
                  player.money -= tile.price;
                  AudioFX.play('cash');
                  logEvent(`💸 ${player.avatar} ${player.nameAr} دفع ${tile.price}$ (${getTileName(tile.id, Game.lang)}).`);
                  if (checkBankruptcy(player)) return;
                  updateUI(); finishTurn(isDbl); return;
              }

              if (tile.type === "chance" || tile.type === "chest") {
                  handleCard(player, tile.type, isDbl); return;
              }

              if (["property", "railroad", "utility"].includes(tile.type)) {
                  if (tile.owner === undefined) {
                      if (player.id === 0 || Game.mode === 'pvp') {
                          promptBuyProperty(tile, isDbl);
                      } else {
                          handleAIBuyDecision(player, tile, isDbl);
                      }
                      return;
                  } else if (tile.owner !== player.id) {
                      const owner = Game.players[tile.owner];

                      // قانون: عندما يكون العقار مرهون لا يدفع اللاعب الإيجار
                      if (tile.mortgaged) {
                          logEvent(Game.lang === 'ar' ? `العقار (${getTileName(tile.id, Game.lang)}) مَرْهُون، معفى من الإيجار.` : `Property is mortgaged; rent-free.`);
                      }
                      // قانون: عندما يكون المالك في السجن لا يحصل على أي إيجارات
                      else if (owner.inJail) {
                          logEvent(Game.lang === 'ar' ? `⛓️ المالك (${owner.nameAr}) في السجن حالياً، لا يستطيع الحصول على الإيجارات أثناء بقاءه في السجن!` : `Owner is in jail; cannot collect rent!`);
                      } else {
                          const rent = calculateRent(tile);
                          player.money -= rent;
                          owner.money += rent;
                          AudioFX.play('cash');
                          logEvent(`🏷️ دفع ${player.avatar} ${player.nameAr} ${rent}$ إيجار إلى ${owner.avatar} ${owner.nameAr} (${getTileName(tile.id, Game.lang)}).`);
                          if (checkBankruptcy(player)) return;
                          updateUI();
                      }

                      if (tile.type === "railroad") {
                          promptRailroadFastTravel(player, tile, isDbl);
                          return;
                      }
                      finishTurn(isDbl); return;
                  } else {
                      if (tile.type === "railroad") {
                          promptRailroadFastTravel(player, tile, isDbl); return;
                      }
                  }
              }

              finishTurn(isDbl);
          }

          function checkBankruptcy(player) {
              if (player.money >= 0) return false;
              while (player.money < 0) {
                  const builtProps = player.props.map(id => BOARD_TILES[id]).filter(t => t && (t.floors || 0) > 0);
                  if (builtProps.length === 0) break;
                  const maxFloors = Math.max(...builtProps.map(t => t.floors || 0));
                  const target = builtProps.find(t => (t.floors || 0) === maxFloors);
                  if (!target) break;
                  const cost = Math.round(target.price * 0.33);
                  const refund = Math.round(cost * 0.50);
                  target.floors--;
                  player.money += refund;
                  logEvent(`🔨 تم هدم طابق في (${getTileName(target.id, Game.lang)}) لدفع المستحقات (+${refund}$).`);
              }
              updateUI();
              if (player.money >= 0) return false;

              const unmortgaged = player.props.filter(id => !BOARD_TILES[id].mortgaged);
              for (const propId of unmortgaged) {
                  if (player.money >= 0) break;
                  const t = BOARD_TILES[propId];
                  t.mortgaged = true;
                  const val = Math.floor(t.price * 0.5);
                  player.money += val;
                  logEvent(`🏦 تم رهن (${getTileName(t.id, Game.lang)}) تلقائياً لدفع المستحقات.`);
              }
              updateUI();
              if (player.money < 0) {
                  const winnerId = (player.id === 0) ? 1 : 0;
                  triggerGameOver(winnerId);
                  return true;
              }
              return false;
          }

          // شاشة الفوز المتحركة الاحتفالية مع تساقط أموال وألعاب نارية وزري اللعب مجدداً والإغلاق
          function triggerGameOver(winnerId) {
              Game.isGameOver = true;
              localStorage.removeItem(SAVE_KEY);
              const winner = Game.players[winnerId];
              const loser = Game.players[winnerId === 0 ? 1 : 0];

              const isAr = (Game.lang === 'ar');
              document.getElementById("goCongratsTitle").innerText = isAr ? "🎉 تهانينا لقد ربحت! 🎉" : "🎉 Congratulations! You Won! 🎉";
              document.getElementById("goWinnerText").innerText = `${winner.avatar} ${winner.nameAr}`;
              document.getElementById("goDetails").innerText = isAr ?
                  `أفلس ${loser.nameAr} ولم يعد يملك أموالاً أو عقارات لتغطية التكاليف!` :
                  `${loser.nameEn} went bankrupt with no cash or assets remaining!`;

              document.getElementById("txtBtnPlayAgain").innerText = I18N[Game.lang].playAgain || (isAr ? "🔄 اللعب من جديد" : "🔄 Play Again");
              document.getElementById("txtBtnCloseGame").innerText = I18N[Game.lang].closeGame || (isAr ? "🚪 إغلاق" : "🚪 Close");

              document.getElementById("gameOverModal").classList.add("show");

              // بدء تساقط الأموال على كامل رقعة وشاشة اللعبة
              startMoneyRain();

              // تشغيل أصوات الألعاب النارية الاحتفالية الجميلة
              AudioFX.play('firework');
              if (fireworkSoundInterval) clearInterval(fireworkSoundInterval);
              fireworkSoundInterval = setInterval(() => {
                  if (!Game.isGameOver) {
                      clearInterval(fireworkSoundInterval);
                      return;
                  }
                  AudioFX.play('firework');
              }, 1700);
          }

          function startMoneyRain() {
              const container = document.getElementById("moneyRainContainer");
              if (!container) return;
              container.innerHTML = "";
              container.style.display = "block";

              const symbols = ["💵", "💸", "💰", "🪙", "💎", "👑"];
              for (let i = 0; i < 48; i++) {
                  const bill = document.createElement("div");
                  bill.className = "money-bill";
                  bill.innerText = symbols[Math.floor(Math.random() * symbols.length)];
                  bill.style.left = (Math.random() * 95) + "%";
                  bill.style.fontSize = (18 + Math.random() * 22) + "px";
                  bill.style.animationDuration = (2.0 + Math.random() * 2.5) + "s";
                  bill.style.animationDelay = (Math.random() * 3) + "s";
                  container.appendChild(bill);
              }
          }

          function stopMoneyRain() {
              const container = document.getElementById("moneyRainContainer");
              if (container) {
                  container.innerHTML = "";
                  container.style.display = "none";
              }
              if (fireworkSoundInterval) {
                  clearInterval(fireworkSoundInterval);
                  fireworkSoundInterval = null;
              }
          }

          function restartFromVictory() {
              stopMoneyRain();
              document.getElementById("gameOverModal").classList.remove("show");
              openNewGameSetupModal(true);
          }

          let selectedFastTravelDestId = null;

          // السفر السريع بمحطات القطار: يظهر قطار ينقل اللاعب ويتحرك عبر الخانات ثم يختفي مع صوت القطار
          function promptRailroadFastTravel(player, currentTile, isDbl) {
              const allRails = BOARD_TILES.filter(t => t.type === "railroad");
              const monopolyOwner = Game.players.find(p => allRails.every(r => r.owner === p.id));
              if (!monopolyOwner) {
                  finishTurn(isDbl);
                  return;
              }

              if (player.id !== monopolyOwner.id) {
                  finishTurn(isDbl);
                  return;
              }

              const otherRails = allRails.filter(t => t.id !== currentTile.id);

              if (player.id === 0 || Game.mode === 'pvp') {
                  Game.fastTravelData = { player, currentTile, otherRails, isDbl };
                  selectedFastTravelDestId = otherRails[0].id;
                  renderFastTravelStations(otherRails, selectedFastTravelDestId);

                  const notice = document.getElementById("fastTravelSelectedNotice");
                  if (notice) {
                      notice.innerText = `المحطة المختارة: ${getTileName(selectedFastTravelDestId, Game.lang)} (خانة ${selectedFastTravelDestId})`;
                  }

                  document.getElementById("fastTravelModal").classList.add("show");
              } else {
                  // ذكاء اصطناعي للقطار
                  if (Math.random() > 0.35) {
                      const dest = otherRails[Math.floor(Math.random() * otherRails.length)];
                      executeTrainMovement(player, currentTile, dest, isDbl);
                  } else {
                      finishTurn(isDbl);
                  }
              }
          }

          function selectFastTravelStation(destId) {
              selectedFastTravelDestId = destId;
              if (Game.fastTravelData) {
                  renderFastTravelStations(Game.fastTravelData.otherRails, selectedFastTravelDestId);
                  const notice = document.getElementById("fastTravelSelectedNotice");
                  if (notice) {
                      notice.innerText = `المحطة المختارة: ${getTileName(destId, Game.lang)} (خانة ${destId})`;
                  }
              }
          }

          function renderFastTravelStations(stations, selectedId) {
              const container = document.getElementById("fastTravelStationsContainer");
              if (!container) return;
              container.innerHTML = "";

              stations.forEach(st => {
                  const isSelected = (st.id === selectedId);
                  const card = document.createElement("div");
                  card.style = `
                      background: ${isSelected ? 'rgba(245,158,11,0.25)' : 'var(--box-bg)'};
                      border: 2px solid ${isSelected ? 'var(--gold)' : 'var(--card-border)'};
                      border-radius: 8px;
                      padding: 8px 4px;
                      cursor: pointer;
                      display: flex;
                      flex-direction: column;
                      align-items: center;
                      justify-content: center;
                      gap: 4px;
                      transition: all 0.15s;
                      box-shadow: ${isSelected ? '0 0 10px rgba(245,158,11,0.5)' : 'none'};
                  `;
                  card.onclick = () => selectFastTravelStation(st.id);

                  card.innerHTML = `
                      <div style="font-size:1.5rem;">🚂</div>
                      <div style="font-size:0.75rem; font-weight:900; color:var(--text); text-align:center; line-height:1.2;">${getTileName(st.id, Game.lang)}</div>
                      <div style="font-size:0.65rem; color:var(--dim);">خانة ${st.id}</div>
                      <div style="font-size:0.62rem; color:${isSelected ? 'var(--gold)' : '#94A3B8'}; font-weight:bold;">${isSelected ? '✓ محددة' : 'اضغط للتحديد'}</div>
                  `;
                  container.appendChild(card);
              });
          }

          function confirmFastTravel() {
              if (!Game.fastTravelData) return;
              const { player, currentTile, isDbl } = Game.fastTravelData;
              const destId = selectedFastTravelDestId;
              const dest = BOARD_TILES.find(t => t.id === destId);
              Game.fastTravelData = null;
              document.getElementById("fastTravelModal").classList.remove("show");

              if (dest) {
                  executeTrainMovement(player, currentTile, dest, isDbl);
              } else {
                  finishTurn(isDbl);
              }
          }

          function cancelFastTravel() {
              if (!Game.fastTravelData) return;
              const isDbl = Game.fastTravelData.isDbl;
              Game.fastTravelData = null;
              document.getElementById("fastTravelModal").classList.remove("show");
              finishTurn(isDbl);
          }

          // تنفيذ حركة القطار السريع المتحرك عبر الخانات بصوت القطار ثم يختفي
          function executeTrainMovement(player, fromTile, destTile, isDbl) {
              Game.isRolling = true;
              document.getElementById("btnRoll").disabled = true;

              const path = [];
              let curPos = fromTile.id;
              while (curPos !== destTile.id) {
                  curPos = (curPos + 1) % 40;
                  path.push(curPos);
              }

              const trainEl = document.getElementById("expressTrain");
              const badgeEl = document.getElementById("trainPassengerBadge");
              badgeEl.innerText = player.avatar;

              const pPawn = getPawnEl(player.id);
              pPawn.style.display = "none";

              const startPawns = document.getElementById("pawns-" + fromTile.id);
              if (startPawns) startPawns.appendChild(trainEl);
              trainEl.style.display = "flex";
              trainEl.style.opacity = "1";
              trainEl.style.transform = "scale(1.4)";

              AudioFX.play('trainWhistle');

              let stepIdx = 0;
              const trainInterval = setInterval(() => {
                  if (stepIdx < path.length) {
                      const stepTileId = path[stepIdx];
                      const tilePawns = document.getElementById("pawns-" + stepTileId);
                      if (tilePawns) tilePawns.appendChild(trainEl);
                      AudioFX.play('trainChug');
                      stepIdx++;
                  } else {
                      clearInterval(trainInterval);
                      AudioFX.play('trainWhistle');
                      trainEl.style.transform = "scale(0) rotate(15deg)";
                      trainEl.style.opacity = "0";

                      setTimeout(() => {
                          trainEl.style.display = "none";
                          trainEl.style.transform = "";
                          trainEl.style.opacity = "1";

                          player.pos = destTile.id;
                          pPawn.style.display = "";
                          updatePawns(player.id);
                          updateUI();
                          Game.isRolling = false;

                          const crossedGo = (fromTile.id > destTile.id);
                          if (crossedGo) {
                              logEvent(`🚂 سافر ${player.avatar} ${player.nameAr} بالقطار السريع عبر خط الانطلاق إلى (${getTileName(destTile.id, Game.lang)}) بدون مكافأة الدورة.`);
                          } else {
                              logEvent(`🚂 وصل ${player.avatar} ${player.nameAr} عبر القطار السريع إلى محطة (${getTileName(destTile.id, Game.lang)}).`);
                          }

                          if (destTile.owner === undefined) {
                              setTimeout(() => promptBuyProperty(destTile, isDbl), 300);
                          } else if (destTile.owner !== player.id && !destTile.mortgaged) {
                              const owner = Game.players[destTile.owner];
                              if (owner.inJail) {
                                  logEvent(`⛓️ المالك (${owner.nameAr}) في السجن، لا يستطيع الحصول على الإيجارات!`);
                              } else {
                                  const rent = calculateRent(destTile);
                                  player.money -= rent;
                                  owner.money += rent;
                                  AudioFX.play('cash');
                                  logEvent(`🏷️ دفع ${player.avatar} ${player.nameAr} ${rent}$ إيجار إلى ${owner.avatar} ${owner.nameAr} (${getTileName(destTile.id, Game.lang)}).`);
                                  if (checkBankruptcy(player)) return;
                                  updateUI();
                              }
                              finishTurn(isDbl);
                          } else {
                              finishTurn(isDbl);
                          }
                      }, 200);
                  }
              }, 70);
          }

          function promptBuyProperty(tile, isDbl) {
              Game.pendingTile = { tile, isDbl };
              const cur = Game.players[Game.turn];
              const baseRent = Math.round(tile.price * 0.20);
              const monoRent = Math.round(tile.price * 0.40);
              document.getElementById("deedTitle").innerText = `${tile.icon||""} ${getTileName(tile.id, Game.lang)}`;
              document.getElementById("deedBody").innerHTML = `
                  <div style="text-align:center; margin-bottom:8px;">
                      <div style="font-size:0.78rem; color:var(--dim); margin-bottom:3px;">دور الشراء: <strong style="color:var(--text);">${cur.avatar} ${cur.nameAr}</strong> (الرصيد: <strong style="color:var(--gold);">${cur.money}$</strong>)</div>
                      <span style="display:inline-block; width:13px; height:13px; background:${tile.color}; border-radius:50%; vertical-align:middle;"></span>
                      <strong style="font-size:1.10rem; color:var(--gold); margin:0 5px;">${tile.price}$</strong>
                  </div>
                  <div style="font-size:0.80rem; color:var(--text); text-align:center;">إيجار العقار الأساسي: <strong style="color:var(--gold);">${baseRent}$</strong></div>
                  <div style="font-size:0.72rem; color:var(--dim); text-align:center; margin-top:3px;">(عند احتكار كامل المجموعة يرتفع الإيجار إلى: <strong style="color:var(--gold);">${monoRent}$</strong>)</div>
              `;
              const canAfford = cur.money >= tile.price;
              document.getElementById("btnBuyProp").disabled = !canAfford;
              document.getElementById("deedModal").classList.add("show");
          }

          function closeDeedModal() {
              document.getElementById("deedModal").classList.remove("show");
              if (Game.pendingTile) {
                  const { tile, isDbl } = Game.pendingTile;
                  Game.pendingTile = null;
                  if (tile.type === "railroad") {
                      promptRailroadFastTravel(Game.players[Game.turn], tile, isDbl);
                  } else {
                      finishTurn(isDbl);
                  }
              }
          }

          function confirmBuyProp() {
              if (!Game.pendingTile) return;
              const cur = Game.players[Game.turn];
              const { tile: t, isDbl } = Game.pendingTile;
              if (cur.money >= t.price) {
                  buyProp(cur, t, t.price);
                  Game.pendingTile = null;
                  document.getElementById("deedModal").classList.remove("show");
                  if (t.type === "railroad") {
                      promptRailroadFastTravel(cur, t, isDbl);
                  } else {
                      finishTurn(isDbl);
                  }
              }
          }

          let aucTimerInterval = null;
          let aucSecondsLeft = 5;

          function startAuctionTimer() {
              stopAuctionTimer();
              aucSecondsLeft = 5;
              const timerEl = document.getElementById("aucTimerNum");
              if (timerEl) timerEl.innerText = aucSecondsLeft;

              aucTimerInterval = setInterval(() => {
                  aucSecondsLeft--;
                  if (timerEl) timerEl.innerText = aucSecondsLeft;

                  if (aucSecondsLeft <= 0) {
                      stopAuctionTimer();
                      handleAuctionTimeout();
                  }
              }, 1000);
          }

          function stopAuctionTimer() {
              if (aucTimerInterval) {
                  clearInterval(aucTimerInterval);
                  aucTimerInterval = null;
              }
          }

          function handleAuctionTimeout() {
              const a = Game.auction;
              if (!a) return;
              logEvent(`⏱️ انتهت مهلة الـ 5 ثوانٍ للاعب ${Game.players[a.bidTurn].avatar}!`);
              if (a.highestBidder !== null) {
                  concludeAuction();
              } else {
                  foldAuctionBid();
              }
          }

          function startAuction() {
              if (!Game.pendingTile) return;
              const t = Game.pendingTile.tile;
              const isDbl = Game.pendingTile.isDbl;
              Game.pendingTile = null;
              document.getElementById("deedModal").classList.remove("show");

              Game.auction = { tile:t, isDbl, currentBid:10, highestBidder:null, bidTurn:Game.turn, active:[0,1] };
              document.getElementById("auctionModal").classList.add("show");
              updateAuctionUI();
              startAuctionTimer();
              if (Game.mode === 'ai' && Game.turn === 1) setTimeout(handleAIAuction, 1000);
          }

          function updateAuctionUI() {
              const a = Game.auction;
              if (!a) return;
              document.getElementById("aucPropDetails").innerText = `${a.tile.icon || "🏙️"} ${getTileName(a.tile.id, Game.lang)}`;
              document.getElementById("aucBasePriceVal").innerText = a.tile.price + "$";
              document.getElementById("aucCurrentBid").innerText = a.currentBid + "$";
              document.getElementById("aucHighestBidder").innerText = a.highestBidder !== null ? `${Game.players[a.highestBidder].avatar} ${Game.players[a.highestBidder].nameAr} (${Game.players[a.highestBidder].money}$)` : (Game.lang==='ar'?"لا يوجد مزايد بعد":"No bids yet");
              const cur = Game.players[a.bidTurn];
              document.getElementById("aucTurnPrompt").innerText = `دور: ${cur.avatar} ${cur.nameAr} (رصيده: ${cur.money}$)`;

              const isHumanTurn = (Game.mode === 'pvp') || (a.bidTurn === 0);
              document.getElementById("aucControls").style.display = isHumanTurn ? "flex" : "none";
          }

          function placeAuctionBid(inc) {
              const a = Game.auction; if (!a) return;
              stopAuctionTimer();
              const bidder = a.bidTurn;
              const p = Game.players[bidder];
              const nextBid = a.currentBid + inc;
              if (p.money >= nextBid) {
                  a.currentBid = nextBid;
                  a.highestBidder = bidder;
                  logEvent(`🔨 زاد ${p.avatar} ${p.nameAr} المزاد إلى ${a.currentBid}$!`);
                  nextAuctionTurn();
              } else {
                  startAuctionTimer();
              }
          }

          function foldAuctionBid() {
              const a = Game.auction; if (!a) return;
              stopAuctionTimer();
              logEvent(`❌ انسحب ${Game.players[a.bidTurn].avatar} ${Game.players[a.bidTurn].nameAr} من المزاد.`);
              a.active = a.active.filter(id => id !== a.bidTurn);
              if (a.active.length === 1 && a.highestBidder !== null) {
                  concludeAuction();
              } else if (a.active.length === 0) {
                  document.getElementById("auctionModal").classList.remove("show");
                  const { tile, isDbl } = a;
                  Game.auction = null;
                  if (tile.type === "railroad") {
                      promptRailroadFastTravel(Game.players[Game.turn], tile, isDbl);
                  } else {
                      finishTurn(isDbl);
                  }
              } else {
                  nextAuctionTurn();
              }
          }

          function nextAuctionTurn() {
              const a = Game.auction; if (!a) return;
              a.bidTurn = (a.bidTurn === 0) ? 1 : 0;
              updateAuctionUI();
              startAuctionTimer();
              if (Game.mode === 'ai' && a.bidTurn === 1 && a.active.includes(1)) setTimeout(handleAIAuction, 1000);
          }

          function concludeAuction() {
              const a = Game.auction; if (!a) return;
              stopAuctionTimer();
              document.getElementById("auctionModal").classList.remove("show");
              const winner = Game.players[a.highestBidder];
              logEvent(`🏆 فاز ${winner.avatar} ${winner.nameAr} بمزاد (${getTileName(a.tile.id, Game.lang)}) بمبلغ ${a.currentBid}$!`);
              buyProp(winner, a.tile, a.currentBid);
              const { tile, isDbl } = a;
              Game.auction = null;
              if (tile.type === "railroad") {
                  promptRailroadFastTravel(Game.players[Game.turn], tile, isDbl);
              } else {
                  finishTurn(isDbl);
              }
          }

          function handleAIAuction() {
              const a = Game.auction; if (!a || a.bidTurn !== 1) return;
              const ai = Game.players[1];
              const diff = Game.aiDifficulty || 'medium';

              let maxValMultiplier = 0.9;
              let minCashBuffer = 40;
              let bidStep = 10;

              const myPot = checkMonopolyPot(1, a.tile.group);
              const oppPot = checkMonopolyPot(0, a.tile.group);

              if (diff === 'easy') {
                  maxValMultiplier = 0.70;
                  minCashBuffer = 120;
                  bidStep = 10;
              } else if (diff === 'medium') {
                  maxValMultiplier = myPot ? 1.35 : 1.0;
                  minCashBuffer = 40;
                  bidStep = 15;
              } else if (diff === 'hard') {
                  maxValMultiplier = (myPot || oppPot) ? 1.85 : 1.4;
                  minCashBuffer = 10;
                  bidStep = 25;
              } else {
                  // المستوى الصعب جداً: شرس جداً في المزايدة لحرمان الخصم وإكمال مجموعاته الخاصة
                  maxValMultiplier = (myPot || oppPot) ? 3.2 : 2.2;
                  minCashBuffer = 5;
                  bidStep = 30;
              }

              const maxBidAI = Math.floor(a.tile.price * maxValMultiplier);
              if (a.currentBid + bidStep <= maxBidAI && ai.money >= a.currentBid + bidStep + minCashBuffer) {
                  placeAuctionBid(bidStep);
              } else {
                  foldAuctionBid();
              }
          }

          function handleAIBuyDecision(player, tile, isDbl) {
              const diff = Game.aiDifficulty || 'medium';
              let shouldBuy = false;
              const pot = checkMonopolyPot(1, tile.group);
              const opponentPot = checkMonopolyPot(0, tile.group);

              if (diff === 'easy') {
                  if (player.money >= tile.price + 450 && Math.random() > 0.35) {
                      shouldBuy = true;
                  }
              } else if (diff === 'medium') {
                  const hasCash = player.money >= tile.price + 100;
                  if (hasCash || pot) {
                      shouldBuy = true;
                  }
              } else if (diff === 'hard') {
                  if (player.money >= tile.price && (player.money >= tile.price + 50 || pot || opponentPot || tile.type === 'railroad')) {
                      shouldBuy = true;
                  }
              } else {
                  // المستوى الصعب جداً: يشتري كل ما يتاح له بلا تردد ويحكم قبضته على الرقعة
                  if (player.money >= tile.price) {
                      shouldBuy = true;
                  }
              }

              if (shouldBuy) {
                  buyProp(player, tile, tile.price);
                  if (tile.type === "railroad") {
                      promptRailroadFastTravel(player, tile, isDbl);
                  } else {
                      finishTurn(isDbl);
                  }
              } else {
                  Game.pendingTile = { tile, isDbl };
                  startAuction();
              }
          }

          function checkMonopolyPot(playerId, group) {
              if (!group) return false;
              const groupTiles = BOARD_TILES.filter(t => t.group === group);
              const owned = groupTiles.filter(t => t.owner === playerId).length;
              return owned > 0;
          }

          function buyProp(player, tile, price) {
              player.money -= price;
              tile.owner = player.id;
              player.props.push(tile.id);
              AudioFX.play('cash');
              logEvent(`🎉 اشترى ${player.avatar} ${player.nameAr} (${getTileName(tile.id, Game.lang)}) مقابل ${price}$.`);
              updateUI();
          }

          function handleCard(player, type, isDbl) {
              const cards = [
                  { textAr:"ربحت في مسابقة الحظ الملكية! استلم 100$", textEn:"Won royal lottery! Collect 100$", action:"cash", val:100 },
                  { textAr:"غرامة مخالفة سرعة! ادفع 50$", textEn:"Speeding fine! Pay 50$", action:"cash", val:-50 },
                  { textAr:"تقدم مباشرة إلى خانة انطلق واربح 200$", textEn:"Advance to GO, collect 200$", action:"go" },
                  { textAr:"أُرسلت مباشرة إلى السجن!", textEn:"Go directly to jail!", action:"jail" }
              ];
              const c = cards[Math.floor(Math.random() * cards.length)];
              logEvent(`📜 ${Game.lang==='ar'?c.textAr:c.textEn}`);
              if (c.action === "cash") {
                  player.money += c.val;
                  if (checkBankruptcy(player)) return;
                  AudioFX.play('cash'); updateUI(); finishTurn(isDbl);
              } else if (c.action === "go") {
                  player.pos = 0; player.money += 200;
                  AudioFX.play('cash'); updatePawns(player.id); updateUI(); finishTurn(isDbl);
              } else if (c.action === "jail") {
                  sendToJail(player, () => finishTurn(false));
              }
          }

          // عند إرسال اللاعب إلى السجن: صوت إنذار شرطة حقيقي عند الانتقال + صوت إغلاق زنزانة السجن فور الوصول وملاحظة منع الإيجارات
          function sendToJail(player, onFinish) {
              Game.isRolling = true;
              document.getElementById("btnRoll").disabled = true;

              if (player.pos === 10) {
                  player.inJail = true;
                  player.jailTurns = 3;
                  AudioFX.play('jailDoor');
                  updatePawns(player.id);
                  updateBoardVisual();
                  updateUI();
                  logEvent(`🚔 دَخَل ${player.avatar} ${player.nameAr} السجن! ⚠️ لا يستطيع اللاعب الحصول على الإيجارات أثناء بقاءه في السجن.`);
                  Game.isRolling = false;
                  if (onFinish) onFinish();
                  return;
              }

              const jailInterval = setInterval(() => {
                  if (player.pos !== 10) {
                      player.pos = (player.pos - 1 + 40) % 40;
                      AudioFX.play('siren');
                      updatePawns(player.id);
                  }

                  if (player.pos === 10) {
                      clearInterval(jailInterval);
                      player.inJail = true;
                      player.jailTurns = 3;
                      AudioFX.play('jailDoor');
                      updatePawns(player.id);
                      updateBoardVisual();
                      updateUI();
                      logEvent(`🚔 دَخَل ${player.avatar} ${player.nameAr} السجن! ⚠️ لا يستطيع اللاعب الحصول على الإيجارات أثناء بقاءه في السجن.`);
                      Game.isRolling = false;
                      if (onFinish) onFinish();
                  }
              }, 130);
          }

          function openJailModal() {
              document.getElementById("jailModal").classList.add("show");
          }

          function payJailFine() {
              const cur = Game.players[Game.turn];
              if (cur.money >= 50) {
                  cur.money -= 50;
                  cur.inJail = false;
                  cur.jailTurns = 0;
                  document.getElementById("jailModal").classList.remove("show");
                  AudioFX.play('cash');
                  updateBoardVisual();
                  updateUI();
                  logEvent(`${cur.avatar} ${cur.nameAr}: ${I18N[Game.lang].finePaid}`);
                  if (Game.turn === 1 && Game.mode === 'ai') {
                      setTimeout(rollDice, 550);
                  } else {
                      document.getElementById("btnRoll").disabled = false;
                  }
              } else {
                  rollForJail();
              }
          }

          function rollForJail() {
              document.getElementById("jailModal").classList.remove("show");
              const v0 = Math.floor(Math.random() * 6) + 1;
              const v1 = Math.floor(Math.random() * 6) + 1;
              setDieFace(document.getElementById("die0"), v0);
              setDieFace(document.getElementById("die1"), v1);
              const cur = Game.players[Game.turn];
              if (v0 === v1) {
                  cur.inJail = false;
                  cur.jailTurns = 0;
                  logEvent(`${cur.avatar} ${cur.nameAr}: ${I18N[Game.lang].doublesJail}`);
                  updateBoardVisual();
                  updateUI();
                  moveSteps(cur, v0 + v1, false);
              } else {
                  cur.jailTurns--;
                  if (cur.jailTurns <= 0) {
                      cur.money = Math.max(0, cur.money - 50);
                      cur.inJail = false;
                      cur.jailTurns = 0;
                      logEvent(Game.lang==='ar' ? `انتهت مدة السجن لـ ${cur.nameAr} ودفع 50$ كفالة إجبارية.` : `Jail sentence finished; paid 50$ fine.`);
                      updateBoardVisual();
                      updateUI();
                      moveSteps(cur, v0 + v1, false);
                  } else {
                      logEvent(Game.lang==='ar' ? `لم يتطابق النرد (${v0}+${v1})! بقي ${cur.nameAr} في السجن.` : `No doubles (${v0}+${v1})! Still in Jail.`);
                      finishTurn(false);
                  }
              }
          }

          function finishTurn(isDbl) {
              Game.isRolling = false;
              if (Game.isGameOver) return;
              if (isDbl && !Game.players[Game.turn].inJail) {
                  logEvent(`🔥 رمية متطابقة! يحصل ${Game.players[Game.turn].avatar} ${Game.players[Game.turn].nameAr} على رمية إضافية.`);
                  startPlayerTurn();
                  return;
              }
              Game.doublesInRow = 0;
              Game.turn = (Game.turn === 0) ? 1 : 0;
              updateUI();
              startPlayerTurn();
          }

          function startPlayerTurn() {
              if (Game.isGameOver) return;
              updateUI();
              const cur = Game.players[Game.turn];
              if (Game.turn === 0) {
                  document.getElementById("btnRoll").disabled = false;
              } else {
                  if (Game.mode === 'ai') {
                      document.getElementById("btnRoll").disabled = true;
                      checkAIStrategicFinance();
                      checkAIBuilding();
                      setTimeout(() => {
                          if (Game.isGameOver || Game.turn !== 1) return;
                          if (cur.inJail) {
                              handleAIJailDecision(cur);
                          } else {
                              rollDice();
                          }
                      }, 750);
                  } else {
                      document.getElementById("btnRoll").disabled = false;
                  }
              }
          }

